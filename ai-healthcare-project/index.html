
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Healthcare Diagnostic Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#0284c7', // sky-600
              light: '#38bdf8',  // sky-400
              dark: '#0369a1',   // sky-700
              extralight: '#e0f2fe', // sky-100
            },
            secondary: {
              DEFAULT: '#0d9488', // teal-600
              light: '#2dd4bf',  // teal-400
              dark: '#0f766e',   // teal-700
            },
            accent: {
              DEFAULT: '#f59e0b', // amber-500
              light: '#fbbf24',  // amber-400
              dark: '#d97706',   // amber-600
            },
            neutral: {
              50: '#f8fafc',  // slate-50
              100: '#f1f5f9', // slate-100
              200: '#e2e8f0', // slate-200
              300: '#cbd5e1', // slate-300
              500: '#64748b', // slate-500
              700: '#334155', // slate-700
              800: '#1e293b', // slate-800
              900: '#0f172a', // slate-900
            }
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
            'subtle-bounce': 'subtleBounce 2.5s infinite ease-in-out',
            'subtle-float': 'subtleFloat 3s infinite ease-in-out',
            'background-pan': 'backgroundPan 15s linear infinite',
            'button-press-hue': 'buttonPressHue 0.3s ease-out',
            'text-focus-in': 'textFocusIn 0.8s cubic-bezier(0.550, 0.085, 0.680, 0.530) both',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            subtleBounce: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-8px)' },
            },
            subtleFloat: {
                '0%, 100%': { transform: 'translateY(0px) rotate(-1deg)' },
                '50%': { transform: 'translateY(-10px) rotate(1deg)' },
            },
            backgroundPan: {
                '0%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' },
                '100%': { 'background-position': '0% 50%' },
            },
            buttonPressHue: {
              '0%': { filter: 'hue-rotate(0deg) brightness(1)'},
              '50%': { filter: 'hue-rotate(-15deg) brightness(1.1)', transform: 'scale(0.98)'},
              '100%': { filter: 'hue-rotate(0deg) brightness(1)'},
            },
            textFocusIn: {
              '0%': {
                filter: 'blur(12px)',
                opacity: '0',
              },
              '100%': {
                filter: 'blur(0px)',
                opacity: '1',
              },
            }
          }
        }
      }
    }
  </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react/": "https://esm.sh/react@^19.1.0/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.6.1",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.0.1",
    "react-dropzone": "https://esm.sh/react-dropzone@^14.3.8"
  }
}
</script>
</head>
<body class="bg-neutral-50 text-neutral-700 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
<link rel="stylesheet" href="index.css">
<script src="index.tsx" type="module"></script>
